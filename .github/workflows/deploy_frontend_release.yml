name: Deploy frontend release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy release to Vercel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      GENERATED_ARCHIVE: frontend-generated-examples.tar.gz

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download generated frontend data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" \
            --pattern "$GENERATED_ARCHIVE" \
            --dir /tmp
          tar -xzf "/tmp/$GENERATED_ARCHIVE" -C public

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build frontend
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy frontend
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
