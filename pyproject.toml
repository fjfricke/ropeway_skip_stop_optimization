[project]
name = "ropeway-skip-stop-optimization"
version = "0.1.0"
description = "Ropeway skip-stop optimization tools and experiments"
readme = "README.md"
authors = [
    { name = "Felix Fricke", email = "f.fricke@tum.de" }
]
requires-python = ">=3.12"
dependencies = [
    "gurobipy>=13.0.2",
    "numpy>=2.5.1",
    "ortools>=9.15.6755",
    "scipy>=1.18.0",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
native-solvers = ["z3-solver==4.16.0.0", "psutil>=6,<8"]
hexaly = ["hexaly==15.0.20260909"]
didp = ["didppy==0.10.1"]
ibm-cp = ["docplex>=2.32.264,<3", "cplex>=22.2.0.1,<23"]
evolutionary = [
    "optuna==4.5.0",
    "pymoo==0.6.1.6",
]

[project.scripts]
ropeway-skip-stop-optimization = "ropeway_skip_stop_optimization.exports.cli:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
